name: AnimeSparks publishing deployment

on:
  repository_dispatch:
    types: [animesparks-publish]

concurrency:
  group: animesparks-production-rebuild
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: vars.ANIMESPARKS_AUTO_DEPLOY_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and verify production site
        id: build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_WRITES_ENABLED: ${{ vars.ADMIN_WRITES_ENABLED }}
          PUBLIC_DEPLOY_TARGET: production
        run: npm run build:production
      - name: Deploy existing AnimeSparks Worker
        id: deploy
        if: steps.build.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config dist/server/wrangler.json
      - name: Check published article URL
        id: smoke
        if: steps.deploy.outcome == 'success' && github.event.client_payload.articleUrl != ''
        env:
          ARTICLE_URL: ${{ github.event.client_payload.articleUrl }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL(process.env.ARTICLE_URL);
          if (url.hostname !== 'www.animesparks.blog' || !/^\/(?:es\/)?blog\/[a-z0-9-]+$/.test(url.pathname)) throw new Error('Unexpected article URL');
          let response;
          for (let attempt = 0; attempt < 18; attempt++) {
            try { response = await fetch(url, { redirect: 'manual' }); if (response.status === 200) break; } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!response || response.status !== 200) throw new Error(`Published article URL did not return 200 (${response?.status || 'no response'})`);
          const html = await response.text();
          if (!html.includes('<title>') || !html.includes('application/ld+json')) throw new Error('Article HTML is missing title or structured data');
          NODE
      - name: Roll back failed post-deploy article check
        if: steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler rollback --config dist/server/wrangler.json --message "Publishing article URL check failed"
      - name: Record deployment outcome
        if: always()
        env:
          DEPLOYMENT_CALLBACK_KEY: ${{ secrets.DEPLOYMENT_CALLBACK_KEY }}
          JOB_ID: ${{ github.event.client_payload.jobId }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          ARTICLE_URL: ${{ github.event.client_payload.articleUrl }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          const state = process.env.DEPLOY_OUTCOME === 'success' && (process.env.SMOKE_OUTCOME === 'success' || !process.env.ARTICLE_URL) ? 'succeeded' : 'failed';
          const response = await fetch('https://www.animesparks.blog/api/publishing/deployment-result', {
            method: 'POST',
            headers: { authorization: `Bearer ${process.env.DEPLOYMENT_CALLBACK_KEY}`, 'content-type': 'application/json' },
            body: JSON.stringify({ jobId: process.env.JOB_ID, state, runUrl: process.env.RUN_URL, buildOutcome: process.env.BUILD_OUTCOME })
          });
          if (!response.ok) throw new Error(`Could not record deployment outcome: HTTP ${response.status}`);
          NODE
